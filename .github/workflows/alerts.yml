name: تنبيهات مناخ

on:
  schedule:
    - cron: '5 * * * *'   # كل ساعة (بتوقيت UTC) — GitHub قد يتأخر بضع دقائق
  workflow_dispatch:        # تشغيل يدوي = يرسل إشعار تجريبي

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: فحص الطقس وإرسال التنبيه
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CITY: 'مسقط'
          LAT: '23.588'
          LON: '58.383'
        run: |
          set -e
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is missing"; exit 1; fi

          send () {
            BODY=$(jq -n --arg t "$NTFY_TOPIC" --arg ti "$1" --arg m "$2" --arg tag "$3" --argjson p "${4:-4}" \
              '{topic:$t, title:$ti, message:$m, priority:$p, tags:[$tag]}')
            curl -s -H "Content-Type: application/json" -d "$BODY" https://ntfy.sh/ > /dev/null
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            send "✅ تنبيهات مناخ شغالة" "هذا إشعار تجريبي. من الحين بتوصلك تنبيهات الرعد والأمطار لـ $CITY حتى والتطبيق مقفول." "white_check_mark"
          fi

          DATA=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&hourly=weather_code,precipitation_probability&forecast_hours=3&timezone=auto")
          NOW=$(echo "$DATA"  | jq '.hourly.weather_code[0] // 0')
          NEXT=$(echo "$DATA" | jq '.hourly.weather_code[1] // 0')
          PROB=$(echo "$DATA" | jq '.hourly.precipitation_probability[1] // 0')
          echo "now=$NOW next=$NEXT prob=$PROB"

          is_rain () { [ "$1" -ge 51 -a "$1" -le 67 ] || [ "$1" -ge 80 -a "$1" -le 82 ]; }

          # نرسل فقط عند بداية الحدث، عشان ما يتكرر التنبيه كل ساعة
          if [ "$NEXT" -ge 95 ] && [ "$NOW" -lt 95 ]; then
            send "⚡ تنبيه رعد وبرق — $CITY" "عواصف رعدية متوقعة خلال الساعة الجاية. ابتعد عن الأودية والأماكن المكشوفة." "zap" 5
          elif is_rain "$NEXT" && ! is_rain "$NOW" && [ "$NOW" -lt 95 ]; then
            send "🌧️ تنبيه أمطار — $CITY" "أمطار متوقعة خلال الساعة الجاية (الاحتمال $PROB%). انتبه في الطرق وابتعد عن مجاري الأودية." "cloud_with_rain" 4
          fi
