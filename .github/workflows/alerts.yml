name: تنبيهات مناخ

on:
  schedule:
    - cron: '5 * * * *'   # كل ساعة — GitHub قد يتأخر بضع دقائق
  workflow_dispatch:        # تشغيل يدوي = إشعار تجريبي

permissions:
  contents: write           # عشان يحدّث ملف الأخبار feed.xml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فحص الطقس والبحر والقمر والطوالع
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT: ${{ github.event_name }}
          # ---- الموقع ----
          CITY: 'مسقط'
          LAT: '23.588'
          LON: '58.383'
          # المناطق اللي يفحص طقسها كل ساعة (الاسم:خط العرض,خط الطول)
          AREAS: >-
            مطرح:23.618,58.567;
            مسقط القديمة:23.614,58.593;
            روي:23.598,58.545;
            القرم:23.616,58.48;
            الخوير:23.596,58.43;
            الغبرة:23.592,58.39;
            بوشر:23.578,58.4;
            العذيبة:23.59,58.364;
            الأنصب:23.557,58.331;
            العامرات:23.522,58.499;
            الخوض:23.587,58.158;
            الحيل:23.651,58.181;
            السيب:23.67,58.189;
            الموالح:23.627,58.25;
            المعبيلة:23.636,58.118;
            قريات:23.264,58.919
          # مناطق تنبيه الرياح: فاضي = كل المناطق، أو اكتب أسماء مفصولة بـ ; مثل 'مطرح;السيب;قريات'
          WIND_AREAS: ''
          SEA_LAT: '23.64'       # نقطة البحر للمد والجزر
          SEA_LON: '58.58'
          TZ_OFFSET: '4'          # توقيت عُمان
          DIGEST_HOUR: '8'        # وقت رسالة الصباح (القمر والطوالع)
          # ---- التنبيهات: 1 تشغيل، 0 إيقاف ----
          ALERT_WEATHER: '1'      # الرعد والبرق والمطر
          ALERT_WIND: '1'         # الرياح واتجاهها
          ALERT_TIDES: '1'        # المد والجزر
          ALERT_MOON: '1'         # أطوار القمر والتربيعات
          ALERT_ANWAA: '1'        # الطوالع والأنواء
          ALERT_CONJ: '1'         # اقترانات القمر بالكواكب والنجوم (قبلها بيوم وقبل المشاهدة بساعة)
          FEED: '1'               # نسخة من التنبيهات في ملف أخبار لتطبيق Feeder
        run: |
          python3 - <<'PY'
          import json, math, os, urllib.request, datetime as dt

          TOPIC = os.environ.get('NTFY_TOPIC', '')
          CITY = os.environ.get('CITY', 'مسقط')
          LAT, LON = float(os.environ.get('LAT', '23.588')), float(os.environ.get('LON', '58.383'))
          SEA_LAT, SEA_LON = float(os.environ.get('SEA_LAT', '23.64')), float(os.environ.get('SEA_LON', '58.58'))
          TZ = dt.timezone(dt.timedelta(hours=float(os.environ.get('TZ_OFFSET', '4'))))
          ON = lambda k: os.environ.get(k, '1') == '1'
          MANUAL = os.environ.get('EVENT') == 'workflow_dispatch'
          DIGEST_HOUR = int(os.environ.get('DIGEST_HOUR', '8'))   # morning message time (local)

          SENT = []
          def send(title, msg, tag, prio=4):
              SENT.append((title, msg))
              print('SEND', prio, title, '|', msg)
              if not TOPIC or os.environ.get('DRY_RUN'): return
              body = json.dumps({'topic': TOPIC, 'title': title, 'message': msg, 'priority': prio, 'tags': [tag]}).encode()
              req = urllib.request.Request('https://ntfy.sh/', data=body, headers={'Content-Type': 'application/json'})
              try: urllib.request.urlopen(req, timeout=20).read()
              except Exception as e: print('ntfy error', e)

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=25) as r: return json.load(r)
              except Exception as e:
                  print('fetch error', url, e); return None

          now = dt.datetime.now(dt.timezone.utc) if not os.environ.get('FAKE_NOW') else dt.datetime.fromisoformat(os.environ['FAKE_NOW'])
          # the hourly slot this run belongs to (cron runs at :05) — keeps alerts from repeating if GitHub starts late
          slot = now.replace(minute=5, second=0, microsecond=0)
          if now.minute < 5: slot -= dt.timedelta(hours=1)
          slot_end = slot + dt.timedelta(hours=1)
          local = slot.astimezone(TZ)
          morning = local.hour == DIGEST_HOUR
          hm = lambda t: t.astimezone(TZ).strftime('%H:%M')

          if MANUAL:
              cats = [n for k, n in [('ALERT_WEATHER', 'الرعد والمطر'), ('ALERT_WIND', 'الرياح واتجاهها'), ('ALERT_TIDES', 'المد والجزر'), ('ALERT_MOON', 'أطوار القمر'), ('ALERT_ANWAA', 'الطوالع والأنواء'), ('ALERT_CONJ', 'اقترانات القمر')] if ON(k)]
              send('✅ تنبيهات مناخ شغالة', 'التنبيهات المفعّلة: ' + '، '.join(cats) + '. توصلك حتى والتطبيق مقفول.', 'white_check_mark', 3)

          AREAS_ALL = []
          for part in os.environ.get('AREAS', '').split(';'):
              if ':' in part:
                  n, xy = part.split(':', 1); la, lo = xy.split(',')
                  AREAS_ALL.append((n.strip(), float(la), float(lo)))
          if not AREAS_ALL: AREAS_ALL = [(CITY, LAT, LON)]

          # ---------- 1) thunder & rain: every area, grouped into one message ----------
          if ON('ALERT_WEATHER'):
              areas = AREAS_ALL
              lats = ','.join(str(a[1]) for a in areas); lons = ','.join(str(a[2]) for a in areas)
              d = get(f'https://api.open-meteo.com/v1/forecast?latitude={lats}&longitude={lons}&hourly=weather_code,precipitation_probability&forecast_hours=3&timezone=auto')
              if isinstance(d, dict): d = [d]
              thunder, rain, pmax = [], [], 0
              is_rain = lambda c: 51 <= c <= 67 or 80 <= c <= 82
              for (name, _, _), r in zip(areas, d or []):
                  h = (r or {}).get('hourly') or {}
                  codes = h.get('weather_code') or [0, 0]; probs = h.get('precipitation_probability') or [0, 0]
                  cnow, cnext, pnext = codes[0] or 0, codes[1] or 0, probs[1] or 0
                  print('weather', name, cnow, cnext, pnext)
                  if cnext >= 95 and cnow < 95: thunder.append(name)
                  elif is_rain(cnext) and not is_rain(cnow) and cnow < 95: rain.append(name); pmax = max(pmax, pnext)
              where = lambda lst: ('كل مناطق ' + CITY) if len(lst) == len(areas) and len(areas) > 1 else '، '.join(lst)
              if thunder:
                  send(f'⚡ تنبيه رعد وبرق — {CITY}', f'عواصف رعدية متوقعة خلال الساعة الجاية في: {where(thunder)}. ابتعد عن الأودية والأماكن المكشوفة.', 'zap', 5)
              if rain:
                  send(f'🌧️ تنبيه أمطار — {CITY}', f'أمطار متوقعة خلال الساعة الجاية في: {where(rain)} (الاحتمال حتى {pmax}%). انتبه في الطرق وابتعد عن مجاري الأودية.', 'cloud_with_rain', 4)

          # ---------- 1b) wind: direction change or strong wind, per area (compares this hour with the last) ----------
          DIRS = ['شمالية', 'شمالية شرقية', 'شرقية', 'جنوبية شرقية', 'جنوبية', 'جنوبية غربية', 'غربية', 'شمالية غربية']
          dir_name = lambda d: DIRS[int(round((d % 360) / 45)) % 8]
          if ON('ALERT_WIND'):
              pick = [n.strip() for n in os.environ.get('WIND_AREAS', '').split(';') if n.strip()]
              wa = [a for a in AREAS_ALL if not pick or a[0] in pick]
              if wa:
                  lats = ','.join(str(a[1]) for a in wa); lons = ','.join(str(a[2]) for a in wa)
                  d = get(f'https://api.open-meteo.com/v1/forecast?latitude={lats}&longitude={lons}&hourly=wind_speed_10m,wind_direction_10m&past_hours=3&forecast_hours=2&wind_speed_unit=kmh&timezone=GMT')
                  if isinstance(d, dict): d = [d]
                  hour_now = slot.replace(minute=0)
                  turned, strong = [], []
                  lvl = lambda v: 2 if v >= 45 else 1 if v >= 30 else 0
                  for (name, _, _), r in zip(wa, d or []):
                      h = (r or {}).get('hourly') or {}
                      ts = [dt.datetime.fromisoformat(t).replace(tzinfo=dt.timezone.utc) for t in h.get('time', [])]
                      if hour_now not in ts: continue
                      i = ts.index(hour_now)
                      if i == 0: continue
                      sp, sp0 = h['wind_speed_10m'][i], h['wind_speed_10m'][i - 1]
                      dg, dg0 = h['wind_direction_10m'][i], h['wind_direction_10m'][i - 1]
                      if None in (sp, sp0, dg, dg0): continue
                      diff = abs((dg - dg0 + 180) % 360 - 180)
                      print('wind', name, round(dg0), '->', round(dg), round(sp0), '->', round(sp))
                      if diff >= 90 and sp >= 10 and dir_name(dg) != dir_name(dg0):
                          turned.append(f'{name} ({dir_name(dg0)} ← {dir_name(dg)}، {round(sp)} كم/س)')
                      if lvl(sp) > lvl(sp0):
                          strong.append((name, round(sp), lvl(sp)))
                  if turned:
                      send(f'💨 تغيّر اتجاه الرياح — {CITY}', 'تغيّر اتجاه الرياح في: ' + '، '.join(turned) + '.', 'dash', 3)
                  if strong:
                      top = max(x[2] for x in strong)
                      send(f'💨 {"رياح قوية جدًا" if top == 2 else "رياح نشطة"} — {CITY}', 'سرعة الرياح ارتفعت في: ' + '، '.join(f'{n} {v} كم/س' for n, v, _ in strong) + '. انتبه من الغبار وارتفاع الموج.', 'dash', 4 if top == 2 else 3)

          # ---------- 2) tides: high / low tide in the coming hour ----------
          if ON('ALERT_TIDES'):
              d = get(f'https://marine-api.open-meteo.com/v1/marine?latitude={SEA_LAT}&longitude={SEA_LON}&hourly=sea_level_height_msl&past_days=1&forecast_days=2&timezone=GMT')
              if d and d.get('hourly'):
                  ts = [dt.datetime.fromisoformat(t).replace(tzinfo=dt.timezone.utc) for t in d['hourly']['time']]
                  lv = d['hourly'].get('sea_level_height_msl') or []
                  for i in range(1, len(lv) - 1):
                      a, b, c = lv[i - 1], lv[i], lv[i + 1]
                      if None in (a, b, c): continue
                      hi, lo = (b >= a and b > c), (b <= a and b < c)
                      if not (hi or lo): continue
                      den = a - 2 * b + c
                      off = 0.5 * (a - c) / den if den else 0
                      t, v = ts[i] + dt.timedelta(hours=off), b - 0.25 * (a - c) * off
                      if slot <= t < slot_end:
                          if hi: send(f'🌊 المد العالي — ساحل {CITY}', f'المد العالي الساعة {hm(t)} (ارتفاع {v:+.2f} م).', 'ocean', 3)
                          else:  send(f'🏖️ الجزر — ساحل {CITY}', f'الجزر الساعة {hm(t)} (منسوب {v:+.2f} م). وقت مناسب للشاطئ.', 'beach_with_umbrella', 3)

          # ---------- 3) moon phases (morning message on the day) ----------
          def moon_phase(k, phase):
              s, c = (lambda x: math.sin(math.radians(x))), (lambda x: math.cos(math.radians(x)))
              k += phase; T = k / 1236.85; T2, T3 = T * T, T * T * T
              pt = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3 + 0.00033 * s(166.56 + 132.87 * T - 0.009173 * T2)
              m = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3
              mp = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3
              f = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3
              if phase < 0.01 or abs(phase - 0.5) < 0.01:
                  pt += ((0.1734 - 0.000393 * T) * s(m) + 0.0021 * s(2 * m) - 0.4068 * s(mp) + 0.0161 * s(2 * mp) - 0.0004 * s(3 * mp) + 0.0104 * s(2 * f)
                         - 0.0051 * s(m + mp) - 0.0074 * s(m - mp) + 0.0004 * s(2 * f + m) - 0.0004 * s(2 * f - m) - 0.0006 * s(2 * f + mp) + 0.0010 * s(2 * f - mp) + 0.0005 * s(m + 2 * mp))
              else:
                  pt += ((0.1721 - 0.0004 * T) * s(m) + 0.0021 * s(2 * m) - 0.6280 * s(mp) + 0.0089 * s(2 * mp) - 0.0004 * s(3 * mp) + 0.0079 * s(2 * f)
                         - 0.0119 * s(m + mp) - 0.0047 * s(m - mp) + 0.0003 * s(2 * f + m) - 0.0004 * s(2 * f - m) - 0.0006 * s(2 * f + mp) + 0.0021 * s(2 * f - mp)
                         + 0.0003 * s(m + 2 * mp) + 0.0004 * s(m - 2 * mp) - 0.0003 * s(2 * m + mp))
                  adj = 0.0028 - 0.0004 * c(m) + 0.0003 * c(mp)
                  pt += adj if phase < 0.5 else -adj
              return dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc) + dt.timedelta(days=pt - 2440587.5, seconds=-69)

          if ON('ALERT_MOON') and morning:
              names = {0: ('🌑 اليوم محاق', 'قمر جديد، والسماء مظلمة ومناسبة لرصد النجوم'), 0.25: ('🌓 اليوم التربيع الأول', 'نصف القمر الأيمن مضيء ويظهر مساءً'),
                       0.5: ('🌕 اليوم بدر', 'القمر مكتمل الإضاءة'), 0.75: ('🌗 اليوم التربيع الأخير', 'نصف القمر الأيسر مضيء ويظهر قبل الفجر')}
              k0 = math.floor((now.year + (now.month - 1) / 12 - 1900) * 12.3685)
              for k in range(k0 - 1, k0 + 2):
                  for p in (0, 0.25, 0.5, 0.75):
                      t = moon_phase(k, p)
                      if t.astimezone(TZ).date() == local.date():
                          send(names[p][0], f'الساعة {hm(t)} — {names[p][1]}.', 'crescent_moon', 3)

          # ---------- 4) anwaa (morning message on the first and last day) ----------
          ANWAA = [(5,12,'الشرطين',13,''),(5,25,'البطين',13,''),(6,7,'الثريا',13,'أول نجوم الصيف وبداية البوارح'),(6,20,'الدبران',13,''),
                   (7,3,'الهقعة',13,''),(7,16,'الهنعة',13,''),(7,29,'الذراع',13,''),(8,11,'النثرة',13,'جمرة القيظ'),
                   (8,24,'الطرفة',13,'طلوع سهيل وانكسار حدة الحر ليلًا'),(9,6,'الجبهة',14,'أول نجوم الخريف'),(9,20,'الزبرة',13,''),(10,3,'الصرفة',13,'انصراف الحر وآخر نجوم سهيل'),
                   (10,16,'العواء',13,'بداية الوسم وموسم الأمطار'),(10,29,'السماك',13,''),(11,11,'الغفر',13,''),(11,24,'الزبانا',13,'آخر نجوم الوسم'),
                   (12,7,'الإكليل',13,'بداية المربعانية وبرد الشتاء'),(12,20,'القلب',13,'أقصر نهار في السنة'),(1,2,'الشولة',13,'آخر المربعانية'),(1,15,'النعائم',13,'بداية الشبط'),
                   (1,28,'البلدة',13,''),(2,10,'سعد الذابح',13,'بداية العقارب'),(2,23,'سعد بلع',13,''),(3,8,'سعد السعود',13,'أول الربيع'),
                   (3,21,'سعد الأخبية',13,'الاعتدال الربيعي'),(4,3,'المقدم',13,''),(4,16,'المؤخر',13,''),(4,29,'الرشا',13,'')]
          if ON('ALERT_ANWAA') and morning:
              today = local.date()
              for i, (mo, dy, name, days, note) in enumerate(ANWAA):
                  start = dt.date(today.year, mo, dy)
                  if start > today: start = dt.date(today.year - 1, mo, dy)
                  last = start + dt.timedelta(days=days - 1)
                  if start == today:
                      send(f'✦ دخل اليوم طالع {name}', f'يمتد {days} يومًا حتى {last.day}/{last.month}.' + (f' {note}.' if note else ''), 'star', 3)
                  elif last == today:
                      nxt = ANWAA[(i + 1) % len(ANWAA)][2]
                      send(f'⏳ آخر يوم في طالع {name}', f'ويدخل بكرة طالع {nxt}.', 'hourglass', 3)


          # ---------- 4b) moon conjunctions with planets & bright stars (day before + an hour before the best viewing time) ----------
          if ON('ALERT_CONJ'):
              R, D = math.radians, math.degrees
              sn, cs = (lambda x: math.sin(R(x))), (lambda x: math.cos(R(x)))
              nrm = lambda x: x % 360
              EL = {
                  'mercury': [0.38709927,0.00000037, 0.20563593,0.00001906, 7.00497902,-0.00594749, 252.25032350,149472.67411175, 77.45779628,0.16047689, 48.33076593,-0.12534081],
                  'venus':   [0.72333566,0.00000390, 0.00677672,-0.00004107, 3.39467605,-0.00078890, 181.97909950,58517.81538729, 131.60246718,0.00268329, 76.67984255,-0.27769418],
                  'earth':   [1.00000261,0.00000562, 0.01671123,-0.00004392, -0.00001531,-0.01294668, 100.46457166,35999.37244981, 102.93768193,0.32327364, 0,0],
                  'mars':    [1.52371034,0.00001847, 0.09339410,0.00007882, 1.84969142,-0.00813131, -4.55343205,19140.30268499, -23.94362959,0.44441088, 49.55953891,-0.29257343],
                  'jupiter': [5.20288700,-0.00011607, 0.04838624,-0.00013253, 1.30439695,-0.00183714, 34.39644051,3034.74612775, 14.72847983,0.21252668, 100.47390909,0.20469106],
                  'saturn':  [9.53667594,-0.00125060, 0.05386179,-0.00050991, 2.48599187,0.00193609, 49.95424423,1222.49362201, 92.59887831,-0.41897216, 113.66242448,-0.28867794]}
              def helio(n, T):
                  k = EL[n]; a, e, I, L, w, O = (k[i] + k[i + 1] * T for i in range(0, 12, 2))
                  om, M = w - O, R(nrm(L - w)); E = M + e * math.sin(M)
                  for _ in range(8): E -= (E - e * math.sin(E) - M) / (1 - e * math.cos(E))
                  xp, yp = a * (math.cos(E) - e), a * math.sqrt(1 - e * e) * math.sin(E)
                  co, so, cO, sO, cI, sI = cs(om), sn(om), cs(O), sn(O), cs(I), sn(I)
                  return [(co*cO - so*sO*cI)*xp + (-so*cO - co*sO*cI)*yp, (co*sO + so*cO*cI)*xp + (-so*sO + co*cO*cI)*yp, so*sI*xp + co*sI*yp]
              E0 = 23.4392911
              ecl2eq = lambda v, eps: [v[0], cs(eps)*v[1] - sn(eps)*v[2], sn(eps)*v[1] + cs(eps)*v[2]]
              def radec(v): r = math.hypot(*v); return nrm(D(math.atan2(v[1], v[0]))), D(math.asin(v[2] / r))
              def precess(ra, dec, T):
                  z0, z, th = (2306.2181*T + 0.30188*T*T) / 3600, (2306.2181*T + 1.09468*T*T) / 3600, (2004.3109*T - 0.42665*T*T) / 3600
                  A = cs(dec)*sn(ra + z0); B = cs(th)*cs(dec)*cs(ra + z0) - sn(th)*sn(dec); C = sn(th)*cs(dec)*cs(ra + z0) + cs(th)*sn(dec)
                  return nrm(D(math.atan2(A, B)) + z), D(math.asin(C))
              def planet(n, T):
                  p, e = helio(n, T), helio('earth', T)
                  return precess(*radec(ecl2eq([p[i] - e[i] for i in range(3)], E0)), T)
              def sun(T): e = helio('earth', T); return precess(*radec(ecl2eq([-x for x in e], E0)), T)
              ML = [(0,0,1,0,6288774),(2,0,-1,0,1274027),(2,0,0,0,658314),(0,0,2,0,213618),(0,1,0,0,-185116),(0,0,0,2,-114332),(2,0,-2,0,58793),(2,-1,-1,0,57066),
                    (2,0,1,0,53322),(2,-1,0,0,45758),(0,1,-1,0,-40923),(1,0,0,0,-34720),(0,1,1,0,-30383),(2,0,0,-2,15327),(0,0,1,2,-12528),(0,0,1,-2,10980),(4,0,-1,0,10675),
                    (0,0,3,0,10034),(4,0,-2,0,8548),(2,1,-1,0,-7888),(2,1,0,0,-6766),(1,0,-1,0,-5163),(1,1,0,0,4987),(2,-1,1,0,4036),(2,0,2,0,3994),(4,0,0,0,3861),
                    (2,0,-3,0,3665),(0,1,-2,0,-2689),(2,0,-1,2,-2602),(2,-1,-2,0,2390),(1,0,1,0,-2348),(2,-2,0,0,2236),(0,1,2,0,-2120),(0,2,0,0,-2069)]
              MR = [(0,0,1,0,-20905355),(2,0,-1,0,-3699111),(2,0,0,0,-2955968),(0,0,2,0,-569925),(0,1,0,0,48888),(2,0,-2,0,246158),(2,-1,-1,0,-152138),
                    (2,0,1,0,-170733),(2,-1,0,0,-204586),(0,1,-1,0,-129620),(1,0,0,0,108743),(0,1,1,0,104755),(0,0,1,-2,79661)]
              MB = [(0,0,0,1,5128122),(0,0,1,1,280602),(0,0,1,-1,277693),(2,0,0,-1,173237),(2,0,-1,1,55413),(2,0,-1,-1,46271),(2,0,0,1,32573),(0,0,2,1,17198),
                    (2,0,1,-1,9266),(0,0,2,-1,8822),(2,-1,0,-1,8216),(2,0,-2,-1,4324),(2,0,1,1,4200),(2,1,0,-1,-3359),(2,-1,-1,1,2463),(2,-1,0,1,2211),(2,-1,-1,-1,2065),
                    (0,1,-1,-1,-1870),(4,0,-1,-1,1828),(0,1,0,1,-1794)]
              gmst = lambda jd: nrm(280.46061837 + 360.98564736629 * (jd - 2451545))
              def moon(T, jd):
                  Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T*T; Dm = 297.8501921 + 445267.1114034*T - 0.0018819*T*T
                  M = 357.5291092 + 35999.0502909*T - 0.0001536*T*T; Mp = 134.9633964 + 477198.8675055*T + 0.0087414*T*T
                  F = 93.2720950 + 483202.0175233*T - 0.0036539*T*T; Ec = 1 - 0.002516*T - 0.0000074*T*T
                  A1, A2, A3 = 119.75 + 131.849*T, 53.09 + 479264.290*T, 313.45 + 481266.484*T
                  term = lambda r, f: r[4] * (Ec*Ec if abs(r[1]) == 2 else Ec if r[1] else 1) * f(r[0]*Dm + r[1]*M + r[2]*Mp + r[3]*F)
                  l = sum(term(r, sn) for r in ML) + 3958*sn(A1) + 1962*sn(Lp - F) + 318*sn(A2)
                  b = sum(term(r, sn) for r in MB) - 2235*sn(Lp) + 382*sn(A3) + 175*sn(A1 - F) + 175*sn(A1 + F) + 127*sn(Lp - Mp) - 115*sn(Lp + Mp)
                  dist = 385000.56 + sum(term(r, cs) for r in MR) / 1000
                  lon, lat = nrm(Lp + l / 1e6), b / 1e6
                  v = ecl2eq([dist*cs(lat)*cs(lon), dist*cs(lat)*sn(lon), dist*sn(lat)], E0 - 0.0130042*T)
                  lst = gmst(jd) + LON
                  return radec([v[0] - 6371*cs(LAT)*cs(lst), v[1] - 6371*cs(LAT)*sn(lst), v[2] - 6371*sn(LAT)])
              def altaz(ra, dec, jd):
                  H = gmst(jd) + LON - ra
                  alt = D(math.asin(sn(LAT)*sn(dec) + cs(LAT)*cs(dec)*cs(H)))
                  return alt, nrm(D(math.atan2(-cs(dec)*sn(H), cs(LAT)*sn(dec) - sn(LAT)*cs(dec)*cs(H))))
              sep = lambda a, b: D(math.acos(max(-1, min(1, sn(a[1])*sn(b[1]) + cs(a[1])*cs(b[1])*cs(a[0] - b[0])))))
              STARS = {'regulus': (152.0929, 11.9672), 'spica': (201.2983, -11.1613), 'antares': (247.3519, -26.4320), 'aldebaran': (68.9802, 16.5093), 'pleiades': (56.8711, 24.1051)}
              CNAME = {'mercury': 'عطارد', 'venus': 'الزهرة', 'mars': 'المريخ', 'jupiter': 'المشتري', 'saturn': 'زحل',
                       'regulus': 'قلب الأسد', 'spica': 'السماك الأعزل', 'antares': 'قلب العقرب', 'aldebaran': 'الدبران', 'pleiades': 'الثريا'}
              CDIRS = ['الشمال', 'الشمال الشرقي', 'الشرق', 'الجنوب الشرقي', 'الجنوب', 'الجنوب الغربي', 'الغرب', 'الشمال الغربي']
              def snap(t):
                  jd = t.timestamp() / 86400 + 2440587.5; T = (jd + 69 / 86400 - 2451545) / 36525
                  return jd, T, moon(T, jd), sun(T)
              body = lambda n, T: precess(*STARS[n], T) if n in STARS else planet(n, T)
              def sep_at(n, t): jd, T, m, s = snap(t); return sep(m, body(n, T))
              H1 = dt.timedelta(hours=1)
              t0 = slot.replace(minute=0) - 16 * H1
              grid = [t0 + i * H1 for i in range(16 + 56)]
              for n in CNAME:
                  a = [sep_at(n, t) for t in grid]
                  for i in range(1, len(a) - 1):
                      if not (a[i] <= a[i - 1] and a[i] < a[i + 1] and a[i] < 7): continue
                      lo, hi = grid[i - 1], grid[i + 1]
                      for _ in range(20):
                          m1, m2 = lo + (hi - lo) * 0.382, lo + (hi - lo) * 0.618
                          if sep_at(n, m1) < sep_at(n, m2): hi = m2
                          else: lo = m1
                      tmin = lo + (hi - lo) / 2
                      jd, T, m, s = snap(tmin)
                      if sep(m, s) < 12: continue                     # too close to the sun to see
                      best = None; t = tmin - 14 * H1
                      while t <= tmin + 14 * H1:
                          jd, T, m, s = snap(t); b = body(n, T)
                          if altaz(*s, jd)[0] <= -7:
                              malt, maz = altaz(*m, jd)
                              if malt >= 6 and altaz(*b, jd)[0] >= 4:
                                  d = sep(m, b)
                                  if best is None or d < best[1] - 1e-4: best = (t, d, maz)
                          t += dt.timedelta(minutes=10)
                      if not best: continue                           # happens in daylight / below the horizon
                      bt, bd, baz = best
                      bl = bt.astimezone(TZ)
                      when = bl.strftime('%I:%M').lstrip('0') + (' م' if bl.hour >= 12 else ' ص')
                      where = CDIRS[int(round(baz / 45)) % 8]
                      info = f'أفضل وقت للمشاهدة الساعة {when} جهة {where}، والمسافة بينهما {bd:.1f}° (عرض الإصبع ≈ 2°).'
                      print('conj', n, bl.isoformat(), round(bd, 2))
                      if morning and bl.date() == local.date() + dt.timedelta(days=1):
                          send(f'🪐 بكرة اقتران القمر و{CNAME[n]}', info, 'ringed_planet', 3)
                      if slot + H1 <= bt < slot_end + H1:
                          send(f'🌙 بعد ساعة: القمر و{CNAME[n]}', f'ارفع نظرك للسماء جهة {where} الساعة {when} — المسافة بينهما {bd:.1f}°.', 'crescent_moon', 4)

          # ---------- 5) mirror the alerts into an RSS feed (for Feeder and other readers) ----------
          if SENT and os.environ.get('FEED', '1') == '1' and not os.environ.get('NO_GIT'):
              import subprocess, html, email.utils
              def git(*a, check=True):
                  r = subprocess.run(['git', *a], capture_output=True, text=True)
                  if check and r.returncode: print('git', a, r.stderr); raise SystemExit(0)
                  return r
              git('config', 'user.name', 'manakh-bot')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              if git('ls-remote', '--exit-code', '--heads', 'origin', 'feed', check=False).returncode == 0:
                  git('fetch', 'origin', 'feed'); git('checkout', '-B', 'feed', 'origin/feed')
              else:
                  git('checkout', '--orphan', 'feed'); git('rm', '-rf', '--quiet', '.', check=False)
              items = []
              if os.path.exists('feed.json'):
                  try: items = json.load(open('feed.json', encoding='utf-8'))
                  except Exception: items = []
              for i, (t, m) in enumerate(SENT):
                  items.insert(0, {'id': now.strftime('%Y%m%d%H%M%S') + f'-{i}', 'title': t, 'body': m, 'time': now.isoformat()})
              items = items[:60]
              APP = os.environ.get('APP_URL', 'https://thermoflow-app-latest-9.vercel.app')
              esc = lambda x: html.escape(x, quote=False)
              rss = ['<?xml version="1.0" encoding="UTF-8"?>', '<rss version="2.0"><channel>',
                     '<title>تنبيهات مناخ</title>', f'<link>{APP}</link>', '<description>تنبيهات الطقس والبحر والقمر والطوالع من تطبيق مناخ</description>',
                     '<language>ar</language>', f'<lastBuildDate>{email.utils.format_datetime(now)}</lastBuildDate>', '<ttl>15</ttl>']
              for it in items:
                  rss.append(f'<item><title>{esc(it["title"])}</title><description>{esc(it["body"])}</description><link>{APP}</link>'
                             f'<guid isPermaLink="false">manakh-{it["id"]}</guid><pubDate>{email.utils.format_datetime(dt.datetime.fromisoformat(it["time"]))}</pubDate></item>')
              rss.append('</channel></rss>')
              open('feed.xml', 'w', encoding='utf-8').write('\n'.join(rss))
              json.dump(items, open('feed.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
              open('vercel.json', 'w').write('{"git":{"deploymentEnabled":false}}')   # don't build the website for feed updates
              git('add', 'feed.xml', 'feed.json', 'vercel.json')
              git('commit', '-m', 'تحديث تنبيهات مناخ')
              git('push', 'origin', 'feed')
              print('feed updated:', len(SENT), 'new item(s)')
          PY
