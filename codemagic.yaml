# بناء تطبيق مناخ للآيفون على أجهزة ماك في Codemagic ورفعه إلى TestFlight
workflows:
  manakh-ios:
    name: مناخ — آيفون
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: manakh_asc        # اسم مفتاح App Store Connect اللي تضيفه في إعدادات Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salemaljabri.manakh
      node: 20
      xcode: latest
    triggering:
      events:                              # يشتغل يدويًا من اللوحة، أو تلقائيًا عند أي تحديث على فرع ios-build
        - push
      branch_patterns:
        - pattern: 'ios-build'
          include: true
          source: true
    scripts:
      - name: تثبيت الحزم وتجهيز ملفات الموقع
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع iOS
        script: |
          [ -d ios ] || npx cap add ios
          # Apple تطلب iOS 15 كحد أدنى (ITMS-90068)
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          # آيفون فقط (بدون آيباد) عشان ما تطلب Apple صور آيباد
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "[0-9,]*";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          [ -f ios/App/Podfile ] && sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          npm run assets
          npx cap sync ios
      - name: إعدادات التطبيق (الاسم، الموقع، الاتجاه، اللغة)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string مناخ" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string يستخدم مناخ موقعك لعرض الطقس ومواقيت الصلاة والقبلة والاقترانات لمكانك" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
      - name: الإشعارات من الخادم (Push)
        script: |
          # صلاحية aps-environment
          cat > ios/App/App/App.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          XML
          sed -i '' 's/^[[:space:]]*//' ios/App/App/App.entitlements
          # نربط الصلاحية بكل إعدادات هدف التطبيق (Debug + Release) عن طريق سطر Info.plist الموجود دائمًا
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" ios/App/App.xcodeproj/project.pbxproj || \
            perl -pi -e 's|(INFOPLIST_FILE = "?App/Info\.plist"?;)|$1 CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' ios/App/App.xcodeproj/project.pbxproj
          N=$(grep -c "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" ios/App/App.xcodeproj/project.pbxproj || true)
          echo "entitlements linked in $N build configs"
          [ "$N" -ge 1 ] || { echo "❌ لم يتم ربط صلاحية الإشعارات"; exit 1; }
          cat ios/App/App/App.entitlements
          # تمرير رمز الجهاز من iOS إلى Capacitor
          python3 - <<'PY'
          p = 'ios/App/App/AppDelegate.swift'
          s = open(p).read()
          if 'capacitorDidRegisterForRemoteNotifications' not in s:
              add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind('}')
              s = s[:i] + add + '}\n'
              open(p, 'w').write(s)
          print(open(p).read()[-700:])
          PY
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift || { echo "❌ AppDelegate"; exit 1; }
          grep -i -o "pushnotifications" ios/App/Podfile || { echo "❌ push plugin missing from Podfile"; exit 1; }
      - name: التوقيع
        script: xcode-project use-profiles
      - name: رقم الإصدار والبناء
        script: |
          cd ios/App
          sed -i '' 's/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.2;/g' App.xcodeproj/project.pbxproj
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: بناء ملف IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # النسخة تظهر في TestFlight للمختبرين الداخليين بدون مراجعة
